<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Montaggi</title>
<style>
  :root { --bg:#141416; --panel:#1e1e22; --border:#2e2e36; --text:#e9e9ec; --text-dim:#9a9aa3; --accent:#4a9eff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  header { padding:18px 22px; background:var(--panel); border-bottom:1px solid var(--border); }
  header h1 { margin:0; font-size:17px; }
  main { max-width:760px; margin:0 auto; padding:18px 22px; }
  a.row { display:block; padding:13px 16px; margin:8px 0; border-radius:8px;
          background:var(--panel); border:1px solid var(--border);
          color:var(--text); text-decoration:none; }
  a.row:hover { border-color:var(--accent); }
  .empty { color:var(--text-dim); padding:24px 0; }
</style>
</head>
<body>
<header><h1>Montaggi</h1></header>
<main>
<a class="row" href="https://PerfectScore82.github.io/Condivisione-Montaggi/prova-3.html">Prova 3</a>
<a class="row" href="https://PerfectScore82.github.io/Condivisione-Montaggi/prova-3-2.html">Prova 3</a>
</main>
</body>
</html>
